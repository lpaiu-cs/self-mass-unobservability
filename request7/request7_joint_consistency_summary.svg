<text x="48" y="46" font-family="sans-serif" font-size="24" font-weight="700" fill="#111827">Request 7: provisional joint consistency scaffold</text>
<text x="48" y="74" font-family="sans-serif" font-size="14" fill="#475569">Decoupled vs tied comparison using J0337 Phase A plus the Request 6 local clock audit. Request 3 is reference-only and not used in the likelihood.</text>
<rect x="48" y="108" width="1464" height="190" fill="white" stroke="#cbd5e1"/>
<text x="66" y="138" font-family="sans-serif" font-size="16" font-weight="700" fill="#111827">Clock Surrogate Variants (reference: eta_only_kappa_free)</text>
<text x="66" y="166" font-family="monospace" font-size="13" fill="#111827">s* = 0.13420</text>
<text x="66" y="190" font-family="monospace" font-size="12" fill="#111827">grid_matched: eta_* = 3.831e-04 ± 6.482e-04, kappa_* std = 2.033e-02, corr = 0.325</text>
<text x="66" y="212" font-family="monospace" font-size="12" fill="#111827">eta_only_kappa_free: eta_* = 3.831e-04 ± 6.482e-04, kappa_* std = 4.294e+00, corr = 0.000</text>
<text x="66" y="258" font-family="sans-serif" font-size="12" fill="#475569">grid_matched inherits the Request 6 zeta prior box in kappa_* (box-conditional); eta_only_kappa_free uses the Fisher lever-arm kappa_* width and is the data-driven reference.</text>
<text x="66" y="278" font-family="sans-serif" font-size="12" fill="#475569">The clock branch is a local Gaussian surrogate in (eta_*, kappa_*) derived from Request 6, not a new TOA fit.</text>
