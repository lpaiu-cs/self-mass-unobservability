<text x="66" y="1244" font-family="monospace" font-size="12" fill="#111827">Delta inputs: Voisin et al. (2025), A&amp;A 693, A143 (arXiv:2411.10066), planet vs red-noise hypotheses.</text>
<text x="66" y="1272" font-family="sans-serif" font-size="12" fill="#475569">Request 3 remains a weak-field scale sanity check only; these coefficients were not used as evidence in Request 7.</text>
